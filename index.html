<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test: Právo a Ústava ČR</title>
<style>
:root{--bg:#f4f5fb;--bg2:#e9ecfb;--card:#fff;--tx:#1b2133;--mu:#6b7389;--ac:#4c63e6;--ac2:#8a6cf0;--ok:#25a35f;--okb:#e2f7ea;--ko:#e04a44;--kob:#fdeceb;--bd:#e1e4ee;--sh:0 6px 20px rgba(40,50,100,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--bg2:#171b2b;--card:#1b2030;--tx:#eef0f6;--mu:#9aa3b8;--ac:#7f93ff;--ac2:#b08cff;--ok:#5fd18f;--okb:#15342500;--ko:#ff7a73;--kob:#3d1c1b;--bd:#2c3347;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#10131b;--bg2:#171b2b;--card:#1b2030;--tx:#eef0f6;--mu:#9aa3b8;--ac:#7f93ff;--ac2:#b08cff;--ok:#5fd18f;--okb:#153425;--ko:#ff7a73;--kob:#3d1c1b;--bd:#2c3347;--sh:0 6px 20px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--okb:#153425}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);background:radial-gradient(900px 500px at 10% -10%,var(--bg2),transparent),var(--bg);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:18px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px;font-weight:600}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 12px;transition:transform .2s}
.pill.pop{animation:pop .4s}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.q{background:var(--card);border-radius:20px;padding:22px 20px;font-weight:650;font-size:20px;line-height:1.35;margin-bottom:16px;box-shadow:var(--sh);animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.o{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid transparent;border-radius:16px;padding:13px 14px;margin-bottom:10px;font:inherit;cursor:pointer;box-shadow:var(--sh);animation:slide .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(.08s*var(--d) + .12s);transition:transform .15s,border-color .2s,background .25s}
.o:active:not(:disabled){transform:scale(.97)}
.o b{flex:none;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-size:15px;transition:background .25s}
.o.ok{border-color:var(--ok);background:var(--okb);animation:glow .6s}
.o.ok b{background:var(--ok)}
.o.ko{border-color:var(--ko);background:var(--kob);animation:shake .45s}
.o.ko b{background:var(--ko)}
.o.dim{opacity:.45}
.o:disabled{cursor:default;color:var(--tx)}
.ex{color:var(--mu);font-size:15px;margin:6px 2px 12px;animation:rise .4s both}
.ex strong{color:var(--tx)}
.n{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:16px;padding:16px;width:100%;font:650 17px system-ui;cursor:pointer;box-shadow:0 8px 20px rgba(76,99,230,.3);animation:rise .4s .1s both;transition:transform .15s}
.n:active{transform:scale(.97)}
.r{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px;box-shadow:var(--sh);animation:rise .4s both}
h1{font-size:24px;margin:8px 0 0;text-align:center}
.ring{width:170px;height:170px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .t{stroke:var(--bd)}.ring .v{stroke:url(#g);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:700}
.c{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards;pointer-events:none}
.mark{margin-left:auto;font-size:22px;animation:pop .45s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes glow{0%{transform:scale(1);box-shadow:0 0 0 0 var(--ok)}40%{transform:scale(1.03)}100%{transform:scale(1);box-shadow:0 0 0 14px transparent}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}

.q,.o,.ex{-webkit-user-select:none;user-select:none}
.intro{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:var(--sh);animation:rise .5s both;text-align:center}
.intro h1{margin:0 0 6px}.intro ul{text-align:left;color:var(--mu);font-size:15px;padding-left:20px;margin:14px 0}
.intro input{width:100%;font:inherit;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0 4px;outline:0;transition:border-color .2s,box-shadow .2s}
.intro input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(76,99,230,.18)}
.intro input.err{border-color:var(--ko);animation:shake .4s}
.er{color:var(--ko);font-size:14px;min-height:20px;margin-bottom:8px}
.top{gap:8px}
#ov{position:fixed;inset:0;background:rgba(10,12,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#ov.show{display:flex}
.cb{background:var(--card);border-radius:22px;padding:26px 22px;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .4s}
.cb h2{color:var(--ko);margin:0 0 10px;font-size:22px}.cb p{color:var(--mu);font-size:15px;margin:0 0 14px}
#off{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#f5b021;color:#2a1d00;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;z-index:60;transform:translateY(-140%);transition:transform .35s}
#off.show{transform:none}
.pill.warn{color:#d98a00}.pill.danger{color:var(--ko);animation:pop .6s infinite alternate}

.intro{padding:28px 20px 22px!important}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 12px 28px rgba(76,99,230,.35);animation:float 3s ease-in-out infinite}
.intro h1{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 18px}
.tile{background:var(--bg);border-radius:16px;padding:14px 6px;animation:rise .5s both;animation-delay:calc(.12s*var(--d) + .25s)}
.tile b{display:block;font-size:22px;line-height:1.1}.tile span{display:block;font-size:12px;color:var(--mu);margin-top:4px;line-height:1.25}
.tile.w b{color:var(--ko)}
.sub{color:var(--mu);font-size:13px;margin-top:12px}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.oa label{display:block;font-weight:650;font-size:15px;margin:12px 2px 6px;color:var(--mu)}
.oa input{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px;outline:0;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.oa textarea{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px;outline:0;box-shadow:var(--sh);resize:vertical}
.oa textarea.ok{border-color:var(--ok);background:var(--okb)}.oa textarea.ko{border-color:var(--ko);background:var(--kob)}
.oa input:focus,.oa textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(76,99,230,.18)}
.oa input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(76,99,230,.18)}
.oa input.ok{border-color:var(--ok);background:var(--okb)}.oa input.ko{border-color:var(--ko);background:var(--kob)}
.oa .er{margin:4px 2px 8px}.oa .n{margin-top:6px}
</style></head><body><div class="w" id="app"></div>
<script>
const OA_R=/vzdel|vlastn|svobod|projev|vyjadr|nazor|osetr|nemocnic|lecb|shromaz|sdruz|\bvol(it|b|ebn)|hlasov|zdrav|soukrom|bezpec|zivot|prac|zamest|nabozen|\bvir|petic|rovn|soud|spravedl|pohyb|cestov|informac|stavk|podnik|azyl|listin/;
const OA_D=/skol|docazk|\bdan(e|i|ich)\b|dodrzov|zakon|pojist|vojen|obran|chranit|prirod|pomoc|pece|respekt|rodic|svedc|platit/;
const OA_S=/prokaz|ujm|domluv|jednan|mediac|vyres|argument|naschval|zdravotn|potiz|dukaz|svedk|zaznam|lekar|potvrzen|foto|video|nahravk|mereni|posudek|dokument|zprav|upozorn|vyzv|stiznost|protokol|policie|hasic|odborn|znalec|dokaz|doloz|prukaz/;
const Q=[
["Oprávnění jedince chovat se určitým způsobem (např. požít alkoholický nápoj) je:",["Subjektivní právo","Objektivní právo"],0,"Subjektivní právo = oprávnění konkrétního jedince."],
["Souhrn právních norem, které stanovují pravidla chování pro všechny, je:",["Subjektivní právo","Objektivní právo"],1,"Objektivní právo = soubor právních norem."],
["Který příklad je objektivní právo?",["Mohu jít vyjadřovat své názory na náměstí.","Povinná školní docházka v ČR.","Koupil jsem byt 2kk, uplatňuji vlastnické právo.","Včera jsem si vzal svého partnera."],1,"Obecně platné pravidlo pro všechny = objektivní právo. Ostatní jsou uplatnění konkrétním člověkem."],
["Který příklad je objektivní právo?",["Chodím do školy, uplatňuji tím právo na vzdělání.","Alkohol mohou v ČR konzumovat všichni lidé 18+.","Tereza včera slavila 18 let, může si dát víno.","Jsem vlastníkem majetku, který jsem si řádně koupil/a."],1,"Obecné pravidlo pro všechny 18+ je norma; ostatní jsou konkrétní osoby."],
["Který příklad je subjektivní právo?",["Soubor norem vydaných a uznaných státem.","V ČR je možné vlastnit majetek.","Tereza včera slavila 18 let, může si dát víno.","Alkohol mohou v ČR konzumovat všichni 18+."],2,"Subjektivní = oprávnění konkrétní osoby (Terezy)."],
["Co je povinnost občana ČR?",["Svoboda projevu","Povinná školní docházka","Právo na ochranu zdraví","Právo vlastnit majetek"],1,"Ostatní možnosti jsou práva."],
["Jaké máš jako občan práva a povinnosti? Napiš 2 práva a 2 povinnosti.",null,-1,"Příklady práv: právo na vzdělání, svoboda projevu, volební právo, právo vlastnit majetek, právo na ochranu zdraví. Příklady povinností: povinná školní docházka, platit daně, dodržovat zákony, chránit přírodu.",{need:3,distinct:true,f:[{l:"✅ Práva",g:"Právo",p:"1. právo",r:OA_R},{g:"Právo",p:"2. právo",r:OA_R},{l:"📌 Povinnosti",g:"Povinnost",p:"1. povinnost",r:OA_D},{g:"Povinnost",p:"2. povinnost",r:OA_D}]}],
["Kde budete řešit rozvod?",["Na úřadě","U soudu"],1,"Rozvod manželství rozhoduje soud."],
["Kde budete řešit nárok na dávky sociální podpory?",["Na úřadě","U soudu"],0,"Dávky vyřizuje úřad (Úřad práce); soud až při odvolání/žalobě."],
["Kde budete řešit náhradu škody 70 000 Kč, když pojišťovna odmítla plnit?",["Na úřadě","U soudu"],1,"Majetkový spor řeší soud."],
["Která odpověď se neshoduje s hlavami Ústavy ČR?",["Česká národní banka","Základní ustanovení","Český statistický úřad","Moc zákonodárná"],2,"Český statistický úřad není hlavou Ústavy."],
["Kolik hlav má Ústava ČR?",["10","4","113","8"],3,"Ústava má 8 hlav."],
["Kolik článků má Ústava ČR?",["100","168","113","8"],2,"Ústava má 113 článků."],
["Synonymum pro slovo soudce:",["Advokát","Notář","Doktor","Právník"],3,"Soudce je právník; ostatní jsou jiné profese."],
["Veřejná pomluva, kvůli které osoba přijde o práci, je:",["Trestný čin","Přestupek","Legální"],0,"Pomluva (§ 184 tr. zákoníku) je trestný čin."],
["Jak zvýšíš svou šanci uspět u soudu, pokud ti cigaretový kouř souseda vážně zasahuje do života a rozhodneš se ho zažalovat?",null,-1,"Soud rozhoduje podle důkazů. Vhodné je např.: záznamy a fotky/videa, svědci (další sousedé), potvrzení lékaře o dopadu na zdraví, předchozí písemné upozornění souseda, stížnost u správce domu.",{need:1,f:[{p:"Napiš, co bys udělal/a a proč…",area:true,min:10,r:OA_S}]}],
["Jak zní jeden ze základních právních principů známý už ze starého Říma?",["Smlouvy se mají dodržovat.","Oko za oko, zub za zub.","Neznalost zákona neomlouvá.","Není zločinu a není trestu bez zákona."],2,"Ignorantia legis non excusat – neznalost zákona neomlouvá."],
["Jak se nazývá úvodní část Ústavy ČR s klíčovými myšlenkami?",["Preambule","Základní ustanovení","Přechodná ustanovení","Listina"],0,"Úvodní část Ústavy je preambule."]
];
const L="ABCD",QUIZ_TITLE="Právo a Ústava ČR",QUIZ_MINUTES=15;
const RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbz0hxy637_YimlQQWN85_0TS62Qn-irtzfTMmyQPpZ8HPYXuqG87K92idi6auEJevXJAA/exec";
let openAns="",i=0,sc=0,wrong=[],right=[],order=[],nm="",t0=0,active=false,cheatCount=0,lastCheat=0,isOffline=!navigator.onLine,secondsLeft=QUIZ_MINUTES*60,tI=null,cI=null;
const app=document.getElementById("app");
const GL={1:"1 (Výborný)",2:"2 (Chvalitebný)",3:"3 (Dobrý)",4:"4 (Dostatečný)",5:"5 (Nedostatečný)"};
function sh(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
// ── Odesílání do Google Sheets ──
function sendResultToServer(p){
 if(!RESULTS_ENDPOINT)return;
 fetch(RESULTS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).catch(e=>console.warn("Odeslání se nezdařilo:",e));
}
// ── Ochrana proti kopírování ──
["copy","cut","contextmenu"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
// ── Timer ──
function tick(){const el=document.getElementById("tm");if(!el)return;el.textContent="⏱ "+fmt(secondsLeft);el.className="pill"+(secondsLeft<=60?" danger":secondsLeft<=180?" warn":"")}
function resumeTimer(){tick();clearInterval(tI);tI=setInterval(()=>{secondsLeft--;tick();if(secondsLeft<=0){stopTimer();timeUp()}},1000)}
function stopTimer(){clearInterval(tI);tI=null}
function timeUp(){clearInterval(cI);document.getElementById("ov").classList.remove("show");end()}
// ── Anti-cheat ──
function kbOpen(){const t=document.activeElement&&document.activeElement.tagName;return t==="INPUT"||t==="TEXTAREA"||t==="SELECT"}
window.addEventListener("offline",()=>{isOffline=true;if(active){document.getElementById("off").classList.add("show");stopTimer()}});
window.addEventListener("online",()=>{isOffline=false;document.getElementById("off").classList.remove("show");if(active)resumeTimer()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&active){if(isOffline||kbOpen())return;cheatDetected()}});
window.addEventListener("beforeunload",()=>{if(active&&!isOffline)cheatDetected()});
function ovText(){
 const pn='<span style="color:var(--ko);font-weight:600">−3 min penalizace</span> byla odečtena.';
 document.getElementById("cc").innerHTML=(cheatCount>1?`Toto je již <strong>${cheatCount}. porušení</strong> pravidel. `:"")+pn+`<br>Zbývající čas: <strong id="cl">${fmt(secondsLeft)}</strong>`}
function cheatDetected(){
 const now=Date.now();if(now-lastCheat<2000)return;lastCheat=now;cheatCount++;
 secondsLeft=Math.max(0,secondsLeft-180);tick();
 ovText();document.getElementById("ov").classList.add("show");
 clearInterval(cI);cI=setInterval(()=>{const l=document.getElementById("cl");if(!l){clearInterval(cI);return}l.textContent=fmt(secondsLeft)},1000);
}
function closeOv(){clearInterval(cI);document.getElementById("ov").classList.remove("show")}
// ── Úvod ──
function intro(){
 app.innerHTML=`<div class="intro"><div class="logo">⚖️</div><h1>${QUIZ_TITLE}</h1><div class="ex" style="margin:4px 0 0">Test ABCD</div>
 <div class="tiles"><div class="tile" style="--d:0"><b>⏱ ${QUIZ_MINUTES}</b><span>minut na test</span></div><div class="tile" style="--d:1"><b>${Q.length}</b><span>otázek</span></div><div class="tile w" style="--d:2"><b>−3 min</b><span>za opuštění stránky</span></div></div>
 <input id="ni" placeholder="Jméno a příjmení" autocomplete="name" maxlength="60"><div class="er" id="er"></div>
 <button class="n" id="go" style="animation:none">Začít test →</button><div class="sub">Výsledek se odešle učiteli</div></div>`;
 const ni=document.getElementById("ni");
 ni.onkeydown=e=>{if(e.key==="Enter")begin()};document.getElementById("go").onclick=begin;
}
function begin(){
 const ni=document.getElementById("ni"),v=ni.value.trim();
 if(!v){ni.classList.remove("err");void ni.offsetWidth;ni.classList.add("err");document.getElementById("er").textContent="Zadej své jméno.";ni.focus();return}
 nm=v;i=0;sc=0;wrong=[];right=[];openAns="";cheatCount=0;t0=Date.now();secondsLeft=QUIZ_MINUTES*60;active=true;
 ni.blur();show();resumeTimer();
}
function show(){
 if(i>=Q.length)return end();
 const [t,o,c,e]=Q[i];if(!o)return showOpen(t);order=sh(o.map((x,k)=>k));
 app.innerHTML=`<div class="top"><span>${i+1} / ${Q.length}</span><span class="pill" id="tm">⏱ ${fmt(secondsLeft)}</span><span class="pill" id="pl">⭐ ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${t}</div>`+
 order.map((k,j)=>`<button class="o" style="--d:${j}" data-k="${k}"><b>${L[j]}</b><span>${o[k]}</span></button>`).join("")+`<div id="fb"></div>`;
 app.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 tick();requestAnimationFrame(()=>{app.querySelector(".bar i").style.width=(i+1)/Q.length*100+"%"});
}
function showOpen(t){
 const cfg=Q[i][4];
 app.innerHTML=`<div class="top"><span>${i+1} / ${Q.length}</span><span class="pill" id="tm">⏱ ${fmt(secondsLeft)}</span><span class="pill" id="pl">⭐ ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${t}</div>
 <div class="oa">`+cfg.f.map((f,k)=>(f.l?`<label>${f.l}</label>`:"")+(f.area?`<textarea id="oa${k}" rows="5" placeholder="${f.p}" maxlength="500"></textarea>`:`<input id="oa${k}" placeholder="${f.p}" maxlength="80" autocomplete="off">`)).join("")+
 `<div class="er" id="oer"></div><button class="n" id="oab" style="animation:none">Potvrdit odpověď</button></div><div id="fb"></div>`;
 tick();requestAnimationFrame(()=>{app.querySelector(".bar i").style.width=(i+1)/Q.length*100+"%"});
 document.getElementById("oab").onclick=pickOpen;
}
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function pickOpen(){
 const cfg=Q[i][4],e=Q[i][3];
 const f=cfg.f.map((_,k)=>document.getElementById("oa"+k)),v=f.map(x=>x.value.trim()),er=document.getElementById("oer");
 if(v.some((x,k)=>x.length<(cfg.f[k].min||3))){er.textContent=f.length>1?"Vyplň všechna pole.":"Napiš alespoň jednu celou větu.";return}
 const n=v.map(nz);
 if(cfg.distinct&&new Set(n).size<n.length){er.textContent="Odpovědi se nesmí opakovat.";return}
 er.textContent="";
 const ok=cfg.f.map((q,k)=>q.r.test(n[k])),hits=ok.filter(Boolean).length,good=hits>=cfg.need;
 openAns+=(openAns?"\n":"")+`[${i+1}] `+cfg.f.map((q,k)=>(q.g?q.g+": ":"")+v[k]).join(" | ")+` → ${hits}/${f.length}`;
 f.forEach((x,k)=>{x.disabled=true;x.classList.add(ok[k]?"ok":"ko")});
 document.getElementById("oab").remove();
 if(good){sc++;right.push(i);const p=document.getElementById("pl");p.textContent="⭐ "+sc;p.classList.add("pop")}else wrong.push(i);
 document.getElementById("fb").innerHTML=`<div class="ex"><strong>${good?"Správně!":"Tentokrát ne."}</strong> ${f.length>1?`Rozpoznáno ${hits} ze ${f.length}. `:""}${e}<br><em>Otevřená odpověď se odešle i učiteli k posouzení.</em></div><button class="n" id="nx">${i+1<Q.length?"Další →":"Výsledek"}</button>`;
 document.getElementById("nx").onclick=()=>{i++;show();scrollTo(0,0)};
}
function pick(k){
 const [t,o,c,e]=Q[i];const good=k===c;
 app.querySelectorAll(".o").forEach(b=>{b.disabled=true;const v=+b.dataset.k;
  if(v===c){b.classList.add("ok");b.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>')}
  else if(v===k){b.classList.add("ko");b.insertAdjacentHTML("beforeend",'<span class="mark">✕</span>')}
  else b.classList.add("dim")});
 if(good){sc++;right.push(i);const p=document.getElementById("pl");p.textContent="⭐ "+sc;p.classList.add("pop");if(navigator.vibrate)navigator.vibrate(20)}
 else{wrong.push(i);if(navigator.vibrate)navigator.vibrate([30,40,30])}
 document.getElementById("fb").innerHTML=`<div class="ex"><strong>${good?"Správně!":"Tentokrát ne."}</strong> ${e}</div><button class="n" id="nx">${i+1<Q.length?"Další →":"Výsledek"}</button>`;
 document.getElementById("nx").onclick=()=>{i++;show();scrollTo(0,0)};
}
function confetti(){const col=["#4c63e6","#8a6cf0","#25a35f","#f5b021","#e04a44"];
 for(let n=0;n<40;n++){const d=document.createElement("i");d.className="c";d.style.left=Math.random()*100+"vw";d.style.background=col[n%5];d.style.animationDelay=Math.random()*.8+"s";d.style.animationDuration=1.8+Math.random()*1.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}
function end(){
 stopTimer();active=false;closeOv();
 const el=Math.round((Date.now()-t0)/1000),ts=el>=60?Math.floor(el/60)+"m "+el%60+"s":el+"s";
 const answered=sc+wrong.length,totalWrong=Q.length-sc; // nezodpovězené (vypršel čas) = chybné
 const p=Math.round(sc/Q.length*100),z=p>=81?1:p>=61?2:p>=41?3:p>=21?4:5;
 const r={name:nm,score:sc,wrong:totalWrong,grade:z,ts,cheatCount,p,openAns,review:Q.map((_,n)=>n).filter(n=>!right.includes(n))};
 sendResultToServer({topic:QUIZ_TITLE,name:nm,score:sc,wrong:totalWrong,grade:z,duration:ts,cheatCount,openAnswer:openAns});
 sessionStorage.setItem("quiz_done",JSON.stringify(r));
 result(r,true);
}
function result(r,fresh){
 const C=2*Math.PI*74,tx=["","Výborně! 🎉","Chvalitebně 👏","Dobře 👍","Dostatečně 💪","Nedostatečně"][r.grade];
 app.innerHTML=`<h1>Známka ${r.grade}</h1><p class="ex" style="text-align:center;margin:4px 0 0">${tx}</p>
 <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><defs><linearGradient id="g"><stop offset="0" stop-color="#4c63e6"/><stop offset="1" stop-color="#8a6cf0"/></linearGradient></defs><circle class="t" cx="85" cy="85" r="74"/><circle class="v" id="rv" cx="85" cy="85" r="74" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span id="num">0</span></div>
 <p class="ex" style="text-align:center"><strong>${r.name}</strong><br>${r.score} z ${Q.length} správně · čas ${r.ts}<br>Opuštění stránky: <strong style="color:var(--${r.cheatCount?"ko":"ok"})">${r.cheatCount}×</strong></p>`+
 (r.review.length?`<h2 style="font-size:18px;margin:22px 2px 12px">Co jsi měl/a špatně (${r.review.length})</h2>`:"")+(r.review.map((n,x)=>`<div class="r" style="animation-delay:${.1*x+.3}s"><b>${n+1}. ${Q[n][0]}</b><br>✔ ${Q[n][1]?Q[n][1][Q[n][2]]:"Otevřená odpověď"}<br><span class="ex">${Q[n][3]}</span></div>`).join(""));
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById("rv").style.strokeDashoffset=C*(1-r.p/100)}));
 const el=document.getElementById("num");let v=0;const iv=setInterval(()=>{v+=Math.max(1,Math.round(r.p/30));if(v>=r.p){v=r.p;clearInterval(iv)}el.textContent=v+" %"},40);
 if(fresh&&r.grade<=2)confetti();
}
// Po F5 se znovu zobrazí uložený výsledek (test nelze opakovat)
try{const sv=sessionStorage.getItem("quiz_done");if(sv)result(JSON.parse(sv),false);else intro()}catch(e){intro()}
</script><div id="off">📶 Výpadek WiFi – test pozastaven, čas se nezapočítává. Připoj se zpět a pokračuj.</div>
<div id="ov"><div class="cb"><h2>Opustil/a jsi test!</h2><p>Přepnul/a jsi na jinou záložku nebo aplikaci. To se považuje za <strong>podvod</strong>. Test stále běží!</p><p id="cc"></p><button class="n" style="animation:none" onclick="closeOv()">Pokračovat v testu</button></div></div>
